services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:2053:2053"
      - "127.0.0.1:2096:2096"
      - "127.0.0.1:10000:10000"
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert
    environment:
      - XRAY_VMESS_AEAD_FORCED=false

  cf-vpn:
    image: cloudflare/cloudflared:latest
    container_name: cf-vpn
    restart: unless-stopped
    command: tunnel --protocol http2 --no-autoupdate --url http://3x-ui:10000
    depends_on:
      - 3x-ui

  cf-sub:
    image: cloudflare/cloudflared:latest
    container_name: cf-sub
    restart: unless-stopped
    command: tunnel --protocol http2 --no-autoupdate --url http://3x-ui:2096
    depends_on:
      - 3x-ui
